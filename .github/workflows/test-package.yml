name: Test package

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:

  prepare:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create matrix
        uses: fabiocaccamo/create-matrix-action@842c9dabf1cec0ba7417f30ec26ce2290b951ef0 # v7
        id: create_matrix
        with:
          matrix: |
            python-version {3.11}, django-version {4.2, 5.0, 5.1, 5.2}, database {sqlite, postgres}
            python-version {3.12}, django-version {4.2, 5.0, 5.1, 5.2, 6.0, 6.1}, database {sqlite, postgres}
            python-version {3.13}, django-version {5.1, 5.2, 6.0, 6.1}, database {sqlite, postgres}
            python-version {3.14}, django-version {5.2, 6.0, 6.1}, database {sqlite, postgres}

    outputs:
      matrix: ${{ steps.create_matrix.outputs.matrix }}

  lint:

    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install tools needed
      run: |
        sudo apt install gettext
        python -m pip install --upgrade pip
        pip install tox

    - name: Check migrations
      run: |
        tox -e migrations

    - name: Check translations
      run: |
        tox -e translations

  test:

    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.prepare.outputs.matrix)}}

    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Start TLS Redis
      run: |
        tls_dir="$RUNNER_TEMP/treenode-redis-tls"
        umask 077
        mkdir -p "$tls_dir"
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
          -keyout "$tls_dir/key.pem" \
          -out "$tls_dir/ca.pem"
        cp "$tls_dir/ca.pem" "$tls_dir/cert.pem"
        chmod 755 "$tls_dir"
        chmod 644 "$tls_dir/ca.pem" "$tls_dir/cert.pem" "$tls_dir/key.pem"
        readiness_file="$RUNNER_TEMP/treenode-redis-tls-ready"
        timeout 30s sh -c '
          docker events --filter type=container \
            --filter container=treenode-redis-tls \
            --filter event=health_status \
            --format "{{.Status}}" | grep -m1 -Fx "health_status: healthy"
        ' > "$readiness_file" &
        readiness_pid=$!
        docker run --detach --name treenode-redis-tls \
          --publish 6380:6379 \
          --mount "type=bind,src=$tls_dir,dst=/tls,readonly" \
          --health-cmd "redis-cli --tls --cacert /tls/ca.pem -h 127.0.0.1 -p 6379 ping" \
          --health-interval 1s --health-timeout 5s --health-retries 20 \
          redis:7.4.2-alpine redis-server --port 0 --tls-port 6379 \
          --tls-cert-file /tls/cert.pem --tls-key-file /tls/key.pem \
          --tls-ca-cert-file /tls/ca.pem --tls-auth-clients no
        if [ "$(docker inspect -f "{{.State.Health.Status}}" treenode-redis-tls)" != healthy ] && ! wait "$readiness_pid"; then
          docker logs treenode-redis-tls
          exit 1
        fi
        kill "$readiness_pid" 2>/dev/null || true
        wait "$readiness_pid" 2>/dev/null || true
        rm -f "$readiness_file"
        if [ "$(docker inspect -f "{{.State.Health.Status}}" treenode-redis-tls)" != healthy ]; then
          docker logs treenode-redis-tls
          exit 1
        fi

    - name: Install psycopg2 prerequisites
      run: sudo apt-get install libpq-dev

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Upgrade pip version
      run: |
        python -m pip install --upgrade pip

    - name: Install django
      run: |
        pip install "Django == ${{ matrix.django-version }}.*"

    - name: Install requirements
      run: |
        pip install -e ".[redis]"
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run pre-commit
      run: |
        pre-commit run --all-files --show-diff-on-failure --verbose

    - name: Run tests
      env:
        DATABASE_ENGINE: ${{ matrix.database }}
        TREENODE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        TREENODE_TEST_REDIS_TLS_URL: rediss://localhost:6380/15
        TREENODE_TEST_REDIS_TLS_CA: ${{ runner.temp }}/treenode-redis-tls/ca.pem
        TREENODE_REQUIRE_REDIS_TLS: "1"
      run: |
        coverage run --append --source=treenode runtests.py
        coverage report --show-missing
        coverage xml -o ./coverage.xml

    - name: Remove TLS Redis credentials
      if: always()
      run: |
        docker rm --force treenode-redis-tls || true
        rm -rf "$RUNNER_TEMP/treenode-redis-tls"
        rm -f "$RUNNER_TEMP/treenode-redis-tls-ready"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        verbose: true
